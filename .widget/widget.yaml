version: 1
title: Notification Listener Android

actions:
  - id: build-debug-apk
    label: 一键编译 Debug APK
    type: terminal
    command: ./gradlew assembleDebug
    cwd: .
    group: 构建
    confirm: 确认编译 Debug APK？

  - id: build-install-adb
    label: 编译并安装到 ADB 设备
    type: terminal
    command: ./gradlew assembleDebug && for serial in $(adb devices | awk 'NR > 1 && $2 == "device" { print $1 }'); do adb -s "$serial" install -r app/build/outputs/apk/debug/app-debug.apk || exit $?; done
    cwd: .
    group: 构建
