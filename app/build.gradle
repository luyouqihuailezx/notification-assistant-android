plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

apply plugin: 'io.objectbox'

apply plugin: "com.jaredsburrows.license"

apply plugin: "org.jetbrains.kotlin.plugin.compose"

licenseReport {
    generateCsvReport = false
    generateHtmlReport = true
    generateJsonReport = false

    copyHtmlReportToAssets = true
    copyJsonReportToAssets = false
}

android {
    compileSdk 36

    defaultConfig {
        resourceConfigurations += ['zh-rCN']
        applicationId "com.alftendev.notlistener"
        minSdk 24
        targetSdk 36
        versionCode 51
        versionName "2.8.0"
        // 发布前请创建带签名的 Git 标签，例如 v2.8.0。
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
////////
    signingConfigs {
        release {
            def keystorePath = System.getenv("SIGNING_STORE_FILE") ?: "notificationlistener.jks"
            def keystoreFile = file(keystorePath)

            if (keystoreFile.exists()) {
                storeFile = keystoreFile
                storePassword = System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias = System.getenv("SIGNING_KEY_ALIAS")
                keyPassword = System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }

            minifyEnabled true
            shrinkResources true
            crunchPngs true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    namespace 'com.android.alftendev'
    buildFeatures {
        viewBinding true
        compose true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'

    implementation "androidx.biometric:biometric-ktx:1.4.0-alpha02"

    implementation 'io.objectbox:objectbox-android:5.0.1'
    implementation 'org.apache.commons:commons-lang3:3.20.0'

    // 生成第三方许可证页面：./gradlew licenseReleaseReport

    implementation 'androidx.activity:activity-ktx:1.12.2'

    implementation 'net.lingala.zip4j:zip4j:2.11.5'
    implementation "org.jetbrains.kotlinx:kotlinx-datetime:0.7.1"
    implementation "androidx.palette:palette-ktx:1.0.0"

    implementation 'androidx.activity:activity-compose:1.12.2'
    implementation platform('androidx.compose:compose-bom:2026.02.01')
    androidTestImplementation platform('androidx.compose:compose-bom:2026.02.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation "com.google.accompanist:accompanist-drawablepainter:0.37.3"
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
